name: Deploy SeaweedFS Prod

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build SeaweedFS image with admin patch
        run: |
          docker build -f Dockerfile.seaweedfs -t gisul-seaweedfs:${{ github.sha }} .
          docker save gisul-seaweedfs:${{ github.sha }} > seaweedfs-image.tar
          chmod 644 seaweedfs-image.tar

      - name: Build upload-service image
        run: |
          docker build -f Dockerfile.upload-service -t gisul-upload-service:${{ github.sha }} .
          docker save gisul-upload-service:${{ github.sha }} > upload-service-image.tar
          chmod 644 upload-service-image.tar

      - name: Prepare deploy bundle
        run: |
          mkdir -p bundle
          rsync -a \
            --exclude '.git' \
            --exclude 'bundle' \
            --exclude 'seaweedfs-image.tar' \
            --exclude 'upload-service-image.tar' \
            ./ bundle/
          cp seaweedfs-image.tar upload-service-image.tar bundle/
          ls -lah bundle | head

      - name: Copy deployment bundle to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "bundle/*"
          target: "/home/ubuntu/seaweedfs-deploy"
          strip_components: 1
          timeout: 120s
          command_timeout: 30m
          overwrite: true

      - name: Deploy on VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            STAGE=/home/ubuntu/seaweedfs-deploy
            sudo mkdir -p /opt/seaweedfs
            sudo chown -R ubuntu:ubuntu /opt/seaweedfs

            # Preserve existing secrets, then ensure required keys are present
            if [ -f /opt/seaweedfs/.env ]; then cp /opt/seaweedfs/.env /tmp/seaweedfs.env.bak; fi
            if [ -f /opt/seaweedfs/s3.json ]; then cp /opt/seaweedfs/s3.json /tmp/seaweedfs.s3.bak; fi

            rsync -a --delete \
              --exclude '.env' \
              --exclude 's3.json' \
              --exclude '.git' \
              --exclude 'seaweedfs-image.tar' \
              --exclude 'upload-service-image.tar' \
              "${STAGE}/" /opt/seaweedfs/

            if [ -f /tmp/seaweedfs.env.bak ]; then mv /tmp/seaweedfs.env.bak /opt/seaweedfs/.env; fi
            if [ -f /tmp/seaweedfs.s3.bak ]; then mv /tmp/seaweedfs.s3.bak /opt/seaweedfs/s3.json; fi

            # Always refresh compose env values from GitHub secrets
            cat > /opt/seaweedfs/.env <<EOF
            S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }}
            S3_SECRET_KEY=${{ secrets.S3_SECRET_KEY }}
            S3_DEFAULT_BUCKET=${{ secrets.S3_DEFAULT_BUCKET }}
            S3_ENDPOINT=https://s3api.gisul.co.in
            S3_REGION=us-east-1
            ADMIN_USER=admin
            ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
            EOF

            docker load -i "${STAGE}/seaweedfs-image.tar"
            docker load -i "${STAGE}/upload-service-image.tar"
            cd /opt/seaweedfs
            export SEAWEEDFS_IMAGE=gisul-seaweedfs:${{ github.sha }}
            export UPLOAD_SERVICE_IMAGE=gisul-upload-service:${{ github.sha }}
            export COMPOSE_PROJECT_NAME=seaweedfs
            set -a
            # shellcheck disable=SC1091
            . ./.env
            set +a

            docker tag gisul-upload-service:${{ github.sha }} gisul-upload-service:latest
            docker compose up -d --no-build

            # Apply nginx configs that already have certificates
            sudo cp nginx/storage.gisul.co.in.conf /etc/nginx/sites-available/storage.gisul.co.in
            sudo cp nginx/s3api.gisul.co.in.conf /etc/nginx/sites-available/s3api.gisul.co.in
            sudo ln -sf /etc/nginx/sites-available/storage.gisul.co.in /etc/nginx/sites-enabled/storage.gisul.co.in
            sudo ln -sf /etc/nginx/sites-available/s3api.gisul.co.in /etc/nginx/sites-enabled/s3api.gisul.co.in

            # Only enable upload.gisul.co.in after SSL cert exists
            if [ -f /etc/letsencrypt/live/upload.gisul.co.in/fullchain.pem ]; then
              sudo cp nginx/upload.gisul.co.in.conf /etc/nginx/sites-available/upload.gisul.co.in
              sudo ln -sf /etc/nginx/sites-available/upload.gisul.co.in /etc/nginx/sites-enabled/upload.gisul.co.in
            else
              echo "Skipping upload.gisul.co.in nginx site (SSL cert not issued yet)"
              sudo rm -f /etc/nginx/sites-enabled/upload.gisul.co.in
              # Temporary HTTP proxy on upload host IP path via localhost port until DNS+cert ready
              # Upload portal is still reachable at http://127.0.0.1:8088 on the VM
            fi

            sudo nginx -t
            sudo systemctl reload nginx
            docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
            bash scripts/smoke-test.sh || true
