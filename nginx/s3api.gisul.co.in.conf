server {
    listen 80;
    server_name s3api.gisul.co.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name s3api.gisul.co.in;

    ssl_certificate /etc/letsencrypt/live/s3api.gisul.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/s3api.gisul.co.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 0;

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, PUT, POST, HEAD, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers *;
            add_header Access-Control-Max-Age 86400;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Expose-Headers ETag always;

        proxy_pass http://127.0.0.1:8333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 43200s;
        proxy_send_timeout 43200s;
    }
}
